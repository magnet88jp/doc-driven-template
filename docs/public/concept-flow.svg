<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 260" role="img" aria-labelledby="title desc">
  <title id="title">Document Driven Monorepo Concept Flow</title>
  <desc id="desc">Human and AI Agent read shared docs, which separate design, operations, and delivery before implementation and verification update docs again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill: #f4f0ff; stroke: #b6a4ff; stroke-width: 1.5; rx: 2; }
      .text { fill: #1e293b; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; font-weight: 500; }
      .line { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1158" height="258" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <rect class="box" x="34" y="72" width="92" height="34"/>
  <text class="text small" x="80" y="94" text-anchor="middle">Human</text>

  <rect class="box" x="34" y="142" width="92" height="34"/>
  <text class="text small" x="80" y="164" text-anchor="middle">AI Agent</text>

  <rect class="box" x="188" y="106" width="126" height="44"/>
  <text class="text small" x="251" y="132" text-anchor="middle">Shared docs</text>

  <rect class="box" x="410" y="42" width="190" height="56"/>
  <text class="text small" x="505" y="67" text-anchor="middle">design: ideal architecture</text>
  <text class="text small" x="505" y="84" text-anchor="middle">and principles</text>

  <rect class="box" x="410" y="152" width="190" height="56"/>
  <text class="text small" x="505" y="177" text-anchor="middle">operations: repeatable</text>
  <text class="text small" x="505" y="194" text-anchor="middle">procedures</text>

  <rect class="box" x="680" y="50" width="210" height="66"/>
  <text class="text small" x="785" y="74" text-anchor="middle">delivery: current scope,</text>
  <text class="text small" x="785" y="91" text-anchor="middle">gaps, tasks, acceptance</text>
  <text class="text small" x="785" y="108" text-anchor="middle">criteria</text>

  <rect class="box" x="950" y="72" width="150" height="44"/>
  <text class="text small" x="1025" y="98" text-anchor="middle">implementation</text>

  <rect class="box" x="950" y="162" width="170" height="54"/>
  <text class="text small" x="1035" y="184" text-anchor="middle">verification and docs</text>
  <text class="text small" x="1035" y="201" text-anchor="middle">update</text>

  <path class="line" d="M126 89 C150 89 158 116 188 122"/>
  <path class="line" d="M126 159 C150 159 158 140 188 134"/>
  <path class="line" d="M314 120 C348 120 360 70 410 70"/>
  <path class="line" d="M314 136 C348 136 360 180 410 180"/>
  <path class="line" d="M600 70 C632 70 644 82 680 82"/>
  <path class="line" d="M600 180 C632 180 642 112 680 102"/>
  <path class="line" d="M890 84 C916 84 924 94 950 94"/>
  <path class="line" d="M1100 104 C1136 122 1136 162 1120 182"/>
  <path class="line" d="M950 190 C710 240 360 236 260 150"/>
</svg>
