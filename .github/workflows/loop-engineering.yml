name: Loop Engineering

on:
  push:
    paths:
      - 'docs/content/**/*.md'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  l1-impact-analysis:
    name: L1 impact analysis
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      LOOP_BUDGET_USD: '10'
      LOOP_ESTIMATED_COST_USD: '0'
      LOOP_MAX_ATTEMPTS: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run L1
        run: node scripts/loop-harness.mjs l1

      - name: Commit state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATE.md
          git diff --cached --quiet || git commit -m "chore(loop): append L1 impact analysis"
          git push
